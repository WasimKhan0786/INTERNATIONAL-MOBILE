<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Manage Orders | TechZone</title>
  
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Shared Style settings -->
  <link rel="stylesheet" href="../frontend/css/style.css">
  <!-- Admin Stylesheet -->
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Sidebar (admin-common.js) -->
  <nav class="admin-sidebar"></nav>

  <!-- Workspace -->
  <div class="admin-workspace">
    <!-- Header (admin-common.js) -->
    <header class="admin-header"></header>

    <!-- Content -->
    <main class="admin-content">
      
      <!-- Actions Bar -->
      <section class="admin-actions-bar">
        <div style="display: flex; gap: 15px; align-items: center;">
          <label for="admin-orders-filter-status" style="font-weight:600; font-size:0.95rem;">Filter by Status:</label>
          <select id="admin-orders-filter-status" style="padding: 10px 14px; border: 1px solid var(--border-admin); border-radius: var(--border-radius-sm); background-color: white;">
            <option value="">All Orders</option>
            <option value="Pending">Pending</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Processing">Processing</option>
            <option value="Shipped">Shipped</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
      </section>

      <!-- Orders Table -->
      <div class="admin-table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer Name</th>
              <th>Mobile</th>
              <th>Date</th>
              <th>Total Amount</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="admin-orders-tbody">
            <tr>
              <td colspan="7" style="text-align: center;">
                <div class="spinner" style="margin: 30px auto;"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <!-- Custom Modal Overlay for Order Details (Reused for details displays) -->
  <div class="modal-overlay" id="admin-order-modal">
    <div class="modal-content" style="max-width: 650px;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-admin); padding-bottom:12px; margin-bottom:20px;">
        <h2 style="font-size:1.3rem; font-weight:800;" id="modal-order-title">Order Details: ORD-0000</h2>
        <button id="btn-close-order-modal" style="background:none; border:none; font-size:1.4rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="admin-modal-body">
        <!-- Customer Info Grid -->
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:25px;" class="form-grid">
          <div>
            <h4 style="font-size:0.85rem; text-transform:uppercase; color:var(--text-muted); margin-bottom:5px;">Customer Name</h4>
            <p id="modal-cust-name" style="font-weight:600;"></p>
          </div>
          <div>
            <h4 style="font-size:0.85rem; text-transform:uppercase; color:var(--text-muted); margin-bottom:5px;">Contact Number</h4>
            <p id="modal-cust-mobile" style="font-weight:600;"></p>
          </div>
          <div class="full-width" style="grid-column: 1/-1;">
            <h4 style="font-size:0.85rem; text-transform:uppercase; color:var(--text-muted); margin-bottom:5px;">Delivery Address</h4>
            <p id="modal-cust-address" style="font-weight:600;"></p>
          </div>
          <div>
            <h4 style="font-size:0.85rem; text-transform:uppercase; color:var(--text-muted); margin-bottom:5px;">Email Address</h4>
            <p id="modal-cust-email" style="font-weight:600;"></p>
          </div>
          <div>
            <h4 style="font-size:0.85rem; text-transform:uppercase; color:var(--text-muted); margin-bottom:5px;">Order Date</h4>
            <p id="modal-order-date" style="font-weight:600;"></p>
          </div>
          <div class="full-width" style="grid-column: 1/-1;" id="modal-notes-box">
            <h4 style="font-size:0.85rem; text-transform:uppercase; color:var(--text-muted); margin-bottom:5px;">Order Notes</h4>
            <p id="modal-cust-notes" style="font-style:italic; font-size:0.9rem; color:var(--text-muted);"></p>
          </div>
        </div>

        <!-- Ordered Items list -->
        <h3 style="font-size:0.95rem; font-weight:700; margin-bottom:10px;">Ordered items</h3>
        <div class="order-detail-items-list" id="modal-order-items-container">
          <!-- Item rows -->
        </div>

        <!-- Calculations -->
        <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-end; border-bottom:1px solid var(--border-admin); padding-bottom:15px; margin-bottom:25px;">
          <div style="font-size:0.9rem;">Subtotal: <span id="modal-subtotal" style="font-weight:600; margin-left:15px;">₹0</span></div>
          <div style="font-size:0.9rem;">Delivery Charge: <span id="modal-delivery" style="font-weight:600; margin-left:15px;">₹0</span></div>
          <div style="font-size:1.1rem; font-weight:700;">Grand Total: <span id="modal-total" style="color:var(--primary-color); margin-left:15px;">₹0</span></div>
        </div>

        <!-- Status Management controls -->
        <div style="background-color:var(--bg-admin-light); border-radius:var(--border-radius-sm); padding:15px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <strong style="display:block; font-size:0.9rem;">Change Order Status</strong>
            <span style="font-size:0.75rem; color:var(--text-muted);">Update delivery progress tracking.</span>
          </div>
          <div style="display:flex; gap:10px;">
            <select id="modal-status-select" style="padding:8px 12px; border:1px solid var(--border-admin); border-radius:var(--border-radius-sm); background-color:white;">
              <option value="Pending">Pending</option>
              <option value="Confirmed">Confirmed</option>
              <option value="Processing">Processing</option>
              <option value="Shipped">Shipped</option>
              <option value="Delivered">Delivered</option>
              <option value="Cancelled">Cancelled</option>
            </select>
            <button class="btn btn-primary btn-sm" id="btn-update-order-status">Update</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../frontend/js/api.js"></script>
  <script src="../frontend/js/common.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
