<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Manage Products | TechZone</title>
  
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Shared Style settings -->
  <link rel="stylesheet" href="../frontend/css/style.css">
  <!-- Admin Stylesheet -->
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Sidebar (admin-common.js) -->
  <nav class="admin-sidebar"></nav>

  <!-- Workspace -->
  <div class="admin-workspace">
    <!-- Header (admin-common.js) -->
    <header class="admin-header"></header>

    <!-- Content -->
    <main class="admin-content">
      
      <!-- Actions Bar -->
      <section class="admin-actions-bar">
        <div style="display: flex; gap: 15px; flex-grow: 1; max-width: 800px; flex-wrap: wrap;" class="form-grid">
          <!-- Search box -->
          <div style="position: relative; flex-grow: 1; min-width: 200px;">
            <input type="text" id="admin-product-search" placeholder="Search by name, SKU, brand..." style="padding: 10px 14px 10px 36px; border: 1px solid var(--border-admin); border-radius: var(--border-radius-sm); width: 100%;">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
          </div>
          <!-- Category Filter -->
          <div>
            <select id="admin-product-filter-category" style="padding: 10px 14px; border: 1px solid var(--border-admin); border-radius: var(--border-radius-sm); background-color: white; width: 100%;">
              <option value="">All Categories</option>
              <!-- Filled dynamically -->
            </select>
          </div>
          <!-- Status Filter -->
          <div>
            <select id="admin-product-filter-status" style="padding: 10px 14px; border: 1px solid var(--border-admin); border-radius: var(--border-radius-sm); background-color: white; width: 100%;">
              <option value="">All Statuses</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
          <!-- Sorting Options -->
          <div>
            <select id="admin-product-sort" style="padding: 10px 14px; border: 1px solid var(--border-admin); border-radius: var(--border-radius-sm); background-color: white; width: 100%;">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="stock-asc">Stock: Low to High</option>
              <option value="stock-desc">Stock: High to Low</option>
            </select>
          </div>
        </div>

        <div style="display: flex; gap: 10px;">
          <button id="btn-bulk-upload-trigger" class="btn btn-outline btn-sm"><i class="fa-solid fa-file-excel"></i> Bulk Import</button>
          <a href="add-product.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i> Add New Product</a>
        </div>
      </section>

      <!-- Products Table -->
      <div class="admin-table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Product Info</th>
              <th>Category</th>
              <th>SKU</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Highlights</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="admin-products-tbody">
            <tr>
              <td colspan="9" style="text-align: center;">
                <div class="spinner" style="margin: 30px auto;"></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <!-- Bulk Import Modal -->
  <div class="admin-modal" id="bulk-import-modal">
    <div class="admin-modal-content">
      <div class="admin-modal-header">
        <h3 class="admin-modal-title"><i class="fa-solid fa-file-csv"></i> Bulk Products Import</h3>
        <button class="admin-modal-close" id="bulk-import-modal-close">&times;</button>
      </div>
      <div class="admin-modal-body">
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">
          Upload products and inventories using a CSV template. SKUs already matching existing records will be updated/overwritten automatically.
        </p>
        
        <div class="csv-drop-zone" id="csv-drop-zone">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <p><strong>Click to browse</strong> or drag & drop CSV file here</p>
          <input type="file" id="csv-file-input" accept=".csv" style="display: none;">
        </div>

        <div id="csv-parsed-info" style="display: none;">
          <!-- Loaded dynamically -->
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
          <button class="btn btn-outline btn-sm" id="btn-download-template" style="padding: 8px 12px; font-size: 0.8rem; border-color: var(--border-admin);">
            <i class="fa-solid fa-download"></i> Sample CSV Template
          </button>
          <button class="btn btn-primary btn-sm" id="btn-submit-import" disabled style="padding: 8px 16px; font-size: 0.8rem;">
            <i class="fa-solid fa-upload"></i> Import Products
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../frontend/js/api.js?v=1.0.2"></script>
  <script src="../frontend/js/common.js?v=1.0.2"></script>
  <script src="js/admin-common.js?v=1.0.2"></script>
  <script src="js/products.js?v=1.0.2"></script>
</body>
</html>
