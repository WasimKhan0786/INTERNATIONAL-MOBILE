<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Product Details</title>
  
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Core Design System Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header></header>

  <!-- Breadcrumb Page Banner -->
  <section class="page-banner" style="padding: 25px 0; margin-bottom: 30px;">
    <div class="container" style="text-align: left;">
      <div class="breadcrumb" style="justify-content: flex-start; color: rgba(255,255,255,0.8);">
        <a href="index.html">Home</a>
        <span>/</span>
        <a href="shop.html">Shop</a>
        <span>/</span>
        <a href="shop.html" id="breadcrumb-category">Category</a>
        <span>/</span>
        <span id="breadcrumb-product-name" style="color: white; font-weight: 500;">Product Name</span>
      </div>
    </div>
  </section>

  <!-- Product Details Layout -->
  <main class="container">
    <div class="product-detail-layout" id="product-detail-loader">
      <div class="loader-spinner" style="grid-column: 1/-1;">
        <div class="spinner"></div>
      </div>
    </div>
    
    <div class="product-detail-layout" id="product-detail-content" style="display: none;">
      <!-- Image Gallery Left -->
      <div class="product-detail-gallery">
        <div class="gallery-primary-img">
          <img src="" id="gallery-main-image" alt="Product Image" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=80'">
        </div>
        <div class="gallery-thumbnails" id="gallery-thumbnails-row">
          <!-- Thumbnail cards load here -->
        </div>
      </div>

      <!-- Info Right -->
      <div>
        <div class="detail-brand" id="detail-brand">OnePlus</div>
        <h1 class="detail-title" id="detail-title">SuperVOOC 65W Fast Charger</h1>
        <div class="product-rating" style="font-size: 0.9rem; margin-bottom: 10px;">
          <span class="stars-rating" id="detail-stars">
            <!-- Stars dynamic -->
          </span>
          <span class="rating-count" id="detail-reviews-count">(0 Reviews)</span>
        </div>
        <div class="detail-sku" id="detail-sku">SKU: CHG-SV65-OP</div>

        <!-- Price Details -->
        <div class="detail-price-box">
          <div class="detail-price-row">
            <span class="detail-price" id="detail-price">₹1,299</span>
            <span class="detail-original-price" id="detail-original-price">₹1,999</span>
            <span class="detail-saving" id="detail-saving-pct">35% OFF</span>
          </div>
          <div class="stock-status" id="detail-stock-status">
            <!-- Stock status -->
          </div>
        </div>

        <!-- Description -->
        <div class="detail-description">
          <h3 style="font-size: 1.1rem; margin-bottom: 8px;">Description</h3>
          <p id="detail-description-text" style="color: var(--text-muted); font-size: 0.95rem;"></p>
        </div>

        <!-- Quantity & Order actions -->
        <div class="detail-qty-selector">
          <span style="font-weight: 600;">Quantity:</span>
          <div class="qty-control">
            <button class="qty-btn" id="qty-minus"><i class="fa-solid fa-minus"></i></button>
            <input type="number" class="qty-input" id="qty-val" value="1" min="1" readonly>
            <button class="qty-btn" id="qty-plus"><i class="fa-solid fa-plus"></i></button>
          </div>
        </div>

        <!-- Cart Buttons -->
        <div class="detail-actions">
          <div class="detail-actions-row">
            <button class="btn btn-outline" id="btn-detail-add-cart"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
            <button class="btn btn-secondary" id="btn-detail-buy-now">Buy Now</button>
          </div>
          <a href="" class="btn btn-whatsapp" id="btn-detail-whatsapp-order" target="_blank">
            <i class="fa-brands fa-whatsapp" style="font-size: 1.3rem;"></i> Order on WhatsApp
          </a>
        </div>
      </div>
    </div>

    <!-- Specifications Table -->
    <section class="section-padding" style="border-top: 1px solid var(--border-color); margin-top: 40px;" id="product-specs-section">
      <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 20px;">Product Specifications</h2>
      <table class="specs-table">
        <tbody id="detail-specs-tbody">
          <!-- Dynamically populated rows -->
        </tbody>
      </table>
    </section>

    <!-- Reviews Section -->
    <section class="section-padding" style="border-top: 1px solid var(--border-color);">
      <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px;" class="reviews-wrapper-mobile">
        
        <!-- Review List -->
        <div>
          <h2 style="font-size: 1.4rem; font-weight: 700; margin-bottom: 20px;">Customer Feedback</h2>
          <div class="reviews-grid" id="product-reviews-list" style="grid-template-columns: 1fr; gap: 15px;">
            <!-- Review rows -->
          </div>
        </div>

        <!-- Add Review Form -->
        <div class="review-form-box">
          <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">Write a Review</h3>
          <form id="review-submit-form">
            <div class="form-group" style="margin-bottom: 15px;">
              <label>Your Rating</label>
              <div class="review-stars-input" id="review-stars-input-container">
                <button type="button" class="review-star-btn active" data-rating="1"><i class="fa-solid fa-star"></i></button>
                <button type="button" class="review-star-btn active" data-rating="2"><i class="fa-solid fa-star"></i></button>
                <button type="button" class="review-star-btn active" data-rating="3"><i class="fa-solid fa-star"></i></button>
                <button type="button" class="review-star-btn active" data-rating="4"><i class="fa-solid fa-star"></i></button>
                <button type="button" class="review-star-btn active" data-rating="5"><i class="fa-solid fa-star"></i></button>
              </div>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
              <label for="rev-username">Full Name</label>
              <input type="text" id="rev-username" required placeholder="e.g. Rahul Verma">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
              <label for="rev-comment">Review Comments</label>
              <textarea id="rev-comment" required placeholder="Describe your experience with this mobile accessory..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-sm btn-block">Post Review</button>
          </form>
        </div>

      </div>
    </section>

    <!-- Related Products Grid -->
    <section class="section-padding" style="border-top: 1px solid var(--border-color); margin-bottom: 40px;">
      <div class="section-title" style="margin-bottom: 30px; text-align: left;">
        <h2 style="font-size: 1.4rem;">Related Products</h2>
      </div>
      <div class="products-grid" id="detail-related-grid">
        <!-- Products cards -->
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer></footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
